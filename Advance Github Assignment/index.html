<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="card">
        <header>
            <h1 class="header-title">Palindrome Checker</h1>
            <p class="header-subtitle">Enter text to see if it reads the same forwards and backwards.</p>
        </header>
        <div class="input-field-cont">
            <label for="textInput" class="label">Your Word or Phrase:</label>
            <input type="text" id="textInput" placeholder="e.g., madam, A man a plan a canal Panama" class="text-input" oninput="checkPalindrome()">
        </div>
        <div id="resultContainer" class="result-container result-initial-container">
            <p id="resultText" class="result-text result-initial-text">Type something to begin checking.</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
